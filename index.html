<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Godot Harbor</title>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="app">
      <div id="loading-splash" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#050508;">
        <div style="text-align:center;">
          <img src="/favicon.png" width="48" height="48" alt="" style="margin:0 auto 16px;animation:spin 1.5s linear infinite;border-radius:8px;" />
          <p style="color:#CBD5E0;font-family:Inter,system-ui,sans-serif;font-size:14px;">Godot Harbor</p>
        </div>
      </div>
      <style>@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
