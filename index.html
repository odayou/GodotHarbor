<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Godot Harbor</title>
  </head>
  <body class="bg-surface-light-base dark:bg-surface-base">
    <div id="app">
      <div id="loading-splash" style="position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#1e1e22;z-index:9999;">
        <div style="text-align:center;">
          <img src="/favicon.png" width="48" height="48" alt="" style="margin:0 auto 16px;animation:swing 1s ease-in-out infinite;border-radius:10px;transform:rotate(-15deg);" />
          <p style="color:#dfdfdf;font-family:Inter,system-ui,sans-serif;font-size:14px;">Godot Harbor</p>
        </div>
      </div>
      <style>@keyframes swing{0%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}100%{transform:rotate(-15deg)}}</style>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
