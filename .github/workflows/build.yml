name: Build Godot Harbor

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v0.1.0'
      reason:
        description: 'Build reason'
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_NET_GIT_FETCH_WITH_CLI: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = '${{ github.event.inputs.version }}';
            let releaseId;

            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              core.info(`Release already exists for tag ${tagName}, id=${existing.id}`);
              if (existing.draft) {
                core.info('Existing release is draft, reusing it');
                releaseId = existing.id;
              } else {
                core.setFailed(`Release for tag ${tagName} already published (not draft). Delete it first or use a new version.`);
                return;
              }
            } catch (err) {
              if (err.status === 404) {
                core.info(`No existing release for tag ${tagName}, creating new one`);
                const { data } = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tagName,
                  name: `Godot Harbor ${tagName}`,
                  body: `**Version:** ${tagName}\n**Build Reason:** ${{ github.event.inputs.reason || 'Manual build' }}`,
                  draft: true,
                  prerelease: false
                });
                releaseId = data.id;
              } else {
                throw err;
              }
            }

            core.setOutput('id', releaseId);

  build:
    name: Build ${{ matrix.platform.name }}
    needs: create-release
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - name: macos-universal
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install Perl (Windows, for vendored-openssl)
        if: matrix.platform.os == 'windows-latest'
        run: |
          choco install strawberryperl -y
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Regenerate icons from PNG (Windows)
        if: matrix.platform.os == 'windows-latest'
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Install dependencies (Ubuntu)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgit2-dev \
            libssh2-1-dev

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.event.inputs.version }}
          releaseDraft: true
          prerelease: false
          args: '--target ${{ matrix.platform.target }} --bundles ${{ matrix.platform.bundle }}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*
          if-no-files-found: warn

  hotupdate-manifest:
    name: Generate Hot Update Baseline
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare hot update package
        run: |
          mkdir -p hotupdate-staging/web
          cp -r dist/* hotupdate-staging/web/
          cd hotupdate-staging
          zip -r ../hotupdate.zip web/
          cd ..

      - name: Generate manifest
        run: |
          TAG="${{ github.event.inputs.version }}"
          VERSION="${TAG#v}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/hotupdate-${VERSION}.zip"
          node scripts/generate-update-manifest.js from-zip \
            "$VERSION" \
            hotupdate.zip \
            "$DOWNLOAD_URL" \
            "$VERSION" \
            "" \
            "Baseline hot update for ${TAG}" \
            hotupdate-manifest.json

      - name: Upload assets to release
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const releaseId = parseInt(process.env.RELEASE_ID, 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function uploadAsset(filePath, assetName, contentType) {
              const fileContent = fs.readFileSync(filePath);
              const { data: uploadUrl } = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
              const url = `${uploadUrl.upload_url.replace('{?name,label}', '')}?name=${encodeURIComponent(assetName)}`;

              await github.request({
                method: 'POST',
                url: url,
                headers: {
                  'Content-Type': contentType,
                  'Content-Length': fileContent.length,
                  'Authorization': `token ${process.env.GITHUB_TOKEN}`,
                },
                data: fileContent,
              });
              core.info(`Uploaded ${assetName}`);
            }

            await uploadAsset('hotupdate.zip', `hotupdate-${{ github.event.inputs.version }}.zip`, 'application/zip');
            await uploadAsset('hotupdate-manifest.json', 'hotupdate-manifest.json', 'application/json');

  publish-release:
    name: Publish Release
    needs: [create-release, build, hotupdate-manifest]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result != 'cancelled' }}
    steps:
      - name: Publish Release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const releaseId = parseInt(process.env.RELEASE_ID, 10);
            const failedJobs = '${{ needs.build.result }}';

            if (failedJobs === 'failure') {
              core.info('Some build jobs failed, keeping release as draft');
              return;
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false
            });
            core.info('Release published successfully');
