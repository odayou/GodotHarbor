name: Build Godot Harbor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0) — only use if tag push did not trigger'
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_NET_GIT_FETCH_WITH_CLI: true

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve version from tag or input
        id: resolve
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            echo "ERROR: No version tag found. Push a tag (e.g., v0.2.0) or provide version input."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved: tag=$TAG version=$VERSION"

  create-release:
    name: Create Draft Release
    needs: resolve-version
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
        with:
          script: |
            const tagName = process.env.TAG;
            let releaseId;

            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              core.info(`Release already exists for tag ${tagName}, id=${existing.id}`);
              if (existing.draft) {
                core.info('Existing release is draft, reusing it');
                releaseId = existing.id;
              } else {
                core.setFailed(`Release for tag ${tagName} already published. Delete it first or use a new version.`);
                return;
              }
            } catch (err) {
              if (err.status === 404) {
                core.info(`Creating new draft release for tag ${tagName}`);
                const { data } = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tagName,
                  name: `Godot Harbor ${tagName}`,
                  body: `**Version:** ${tagName}`,
                  draft: true,
                  prerelease: false
                });
                releaseId = data.id;
              } else {
                throw err;
              }
            }

            core.setOutput('id', releaseId);

  build:
    name: Build ${{ matrix.platform.name }}
    needs: [resolve-version, create-release]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - name: macos-universal
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install Perl (Windows, for vendored-openssl)
        if: matrix.platform.os == 'windows-latest'
        run: |
          choco install strawberryperl -y
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Regenerate icons from PNG (Windows)
        if: matrix.platform.os == 'windows-latest'
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Install dependencies (Ubuntu)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgit2-dev \
            libssh2-1-dev

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.resolve-version.outputs.tag }}
          releaseDraft: true
          prerelease: false
          args: '--target ${{ matrix.platform.target }} --bundles ${{ matrix.platform.bundle }}'

      - name: Code sign Windows installer
        if: matrix.platform.os == 'windows-latest'
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERTIFICATE_BASE64)) {
            Write-Host "Skipping code signing: CERTIFICATE_BASE64 not configured"
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "signing-cert.pfx"
          [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64) | Set-Content -Path $certPath -AsByteStream
          $installer = Get-ChildItem -Path "src-tauri\target\${{ matrix.platform.target }}\release\bundle\nsis\*.exe" | Select-Object -First 1
          if ($installer) {
            & signtool sign /f $certPath /p $env:CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $installer.FullName
            Write-Host "Signed: $($installer.FullName)"
          }
          Remove-Item -Force $certPath

      - name: Notarize macOS app
        if: matrix.platform.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "Skipping notarization: APPLE_ID not configured"
            exit 0
          fi
          dmg=$(find src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -n "$dmg" ]; then
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
            echo "Notarized and stapled: $dmg"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*
          if-no-files-found: warn

  hotupdate-manifest:
    name: Generate Hot Update Baseline
    needs: [resolve-version, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare hot update package
        run: |
          mkdir -p hotupdate-staging/web
          cp -r dist/* hotupdate-staging/web/
          cd hotupdate-staging
          zip -r ../hotupdate.zip web/
          cd ..

      - name: Generate manifest
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/hotupdate-${VERSION}.zip"
          node scripts/generate-update-manifest.cjs from-zip \
            "$VERSION" \
            hotupdate.zip \
            "$DOWNLOAD_URL" \
            "$VERSION" \
            "" \
            "Baseline hot update for ${TAG}" \
            hotupdate-manifest.json

      - name: Upload assets to release
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const releaseId = parseInt(process.env.RELEASE_ID, 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.VERSION;

            async function uploadAsset(filePath, assetName, contentType) {
              const fileContent = fs.readFileSync(filePath);
              const { data: releaseData } = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
              const url = `${releaseData.upload_url.replace('{?name,label}', '')}?name=${encodeURIComponent(assetName)}`;

              await github.request({
                method: 'POST',
                url: url,
                headers: {
                  'Content-Type': contentType,
                  'Content-Length': fileContent.length,
                  'Authorization': `token ${process.env.GITHUB_TOKEN}`,
                },
                data: fileContent,
              });
              core.info(`Uploaded ${assetName}`);
            }

            await uploadAsset('hotupdate.zip', `hotupdate-${version}.zip`, 'application/zip');
            await uploadAsset('hotupdate-manifest.json', 'hotupdate-manifest.json', 'application/json');

  publish-release:
    name: Publish Release
    needs: [resolve-version, create-release, build, hotupdate-manifest]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result != 'cancelled' }}
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Publish Release
        id: check
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const releaseId = parseInt(process.env.RELEASE_ID, 10);
            const buildResult = '${{ needs.build.result }}';

            if (buildResult === 'failure') {
              core.info('Build failed, keeping release as draft');
              core.setOutput('published', 'false');
              return;
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false
            });
            core.info('Release published successfully');
            core.setOutput('published', 'true');

  sync-to-gitee:
    name: Sync Release to Gitee
    needs: [resolve-version, create-release, publish-release]
    runs-on: ubuntu-latest
    if: ${{ needs.publish-release.outputs.published == 'true' }}
    steps:
      - name: Sync Release to Gitee
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          GITEE_OWNER: odayou
          GITEE_REPO: godot-harbor
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG;
            const giteeToken = process.env.GITEE_TOKEN;
            const giteeOwner = process.env.GITEE_OWNER;
            const giteeRepo = process.env.GITEE_REPO;

            if (!giteeToken) {
              core.warning('GITEE_TOKEN not configured, skipping sync');
              return;
            }

            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            core.info(`Found GitHub release: ${release.tag_name} (${release.assets.length} assets)`);

            let giteeReleaseId;
            const giteeApiBase = 'https://gitee.com/api/v5';

            try {
              const resp = await fetch(`${giteeApiBase}/repos/${giteeOwner}/${giteeRepo}/releases/tags/${tag}`, {
                headers: { 'Authorization': `token ${giteeToken}` }
              });
              if (resp.ok) {
                const existing = await resp.json();
                giteeReleaseId = existing.id;
                core.info(`Gitee release already exists, id=${giteeReleaseId}`);
              } else {
                core.info('Creating Gitee release...');
                const createResp = await fetch(`${giteeApiBase}/repos/${giteeOwner}/${giteeRepo}/releases`, {
                  method: 'POST',
                  headers: { 'Authorization': `token ${giteeToken}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    tag_name: tag,
                    name: release.name || tag,
                    body: release.body || '',
                    prerelease: release.prerelease,
                    draft: false,
                    target_commitish: 'main'
                  })
                });
                if (!createResp.ok) {
                  const err = await createResp.text();
                  core.setFailed(`Failed to create Gitee release: ${err}`);
                  return;
                }
                const created = await createResp.json();
                giteeReleaseId = created.id;
                core.info(`Created Gitee release, id=${giteeReleaseId}`);
              }
            } catch (err) {
              core.setFailed(`Gitee API error: ${err.message}`);
              return;
            }

            const { data: existingAssets } = await fetch(
              `${giteeApiBase}/repos/${giteeOwner}/${giteeRepo}/releases/${giteeReleaseId}/assets`,
              { headers: { 'Authorization': `token ${giteeToken}` } }
            ).then(r => r.json()).catch(() => []);
            const existingNames = new Set((existingAssets || []).map(a => a.name));

            let uploaded = 0;
            let skipped = 0;
            for (const asset of release.assets) {
              if (existingNames.has(asset.name)) {
                core.info(`Skipping ${asset.name} (already exists on Gitee)`);
                skipped++;
                continue;
              }

              core.info(`Downloading ${asset.name} from GitHub...`);
              const downloadResp = await fetch(asset.url, {
                headers: { 'Authorization': `token ${process.env.GITHUB_TOKEN}`, 'Accept': 'application/octet-stream' },
                redirect: 'manual'
              });
              const downloadUrl = downloadResp.headers.get('location') || downloadResp.url;
              const fileResp = await fetch(downloadUrl);
              if (!fileResp.ok) {
                core.warning(`Failed to download ${asset.name}: ${fileResp.status}`);
                continue;
              }
              const fileBuffer = Buffer.from(await fileResp.arrayBuffer());

              core.info(`Uploading ${asset.name} to Gitee...`);
              const FormData = await import('form-data');
              const form = new FormData.default();
              form.append('file', fileBuffer, { filename: asset.name, contentType: asset.content_type || 'application/octet-stream' });
              form.append('name', asset.name);

              const uploadResp = await fetch(
                `${giteeApiBase}/repos/${giteeOwner}/${giteeRepo}/releases/${giteeReleaseId}/attach_files`,
                {
                  method: 'POST',
                  headers: { 'Authorization': `token ${giteeToken}`, ...form.getHeaders() },
                  body: form
                }
              );

              if (uploadResp.ok) {
                core.info(`Uploaded ${asset.name} to Gitee`);
                uploaded++;
              } else {
                const err = await uploadResp.text();
                core.warning(`Failed to upload ${asset.name}: ${err}`);
              }
            }

            core.info(`Sync complete: ${uploaded} uploaded, ${skipped} skipped, ${release.assets.length} total`);

      - name: Summary
        run: |
          echo "## Gitee Release Sync ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ needs.resolve-version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Gitee Repo**: odayou/GodotHarbor" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://gitee.com/odayou/godot-harbor/releases/${{ needs.resolve-version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
