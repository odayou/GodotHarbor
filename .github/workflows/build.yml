name: Build Godot Harbor

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v0.1.0'
      reason:
        description: 'Build reason'
        required: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            tauri-target: nsis
          - os: windows-latest
            target: windows-aarch64
            tauri-target: nsis
          - os: macos-latest
            target: macos-x86_64
            tauri-target: dmg
          - os: macos-latest
            target: macos-aarch64
            tauri-target: dmg
          - os: ubuntu-latest
            target: linux-x86_64
            tauri-target: deb
          - os: ubuntu-latest
            target: linux-x86_64-appimage
            tauri-target: appimage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust toolchain (Windows x86_64)
        if: matrix.target == 'windows-x86_64'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Install Rust toolchain (Windows aarch64)
        if: matrix.target == 'windows-aarch64'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-aarch64-pc-windows-gnu

      - name: Install Rust toolchain (macOS)
        if: startsWith(matrix.os, 'macos')
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Rust toolchain (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Add aarch64 target (macOS)
        if: matrix.target == 'macos-aarch64'
        run: rustup target add aarch64-apple-darwin

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Godot Harbor v__VERSION__'
          releaseBody: 'See [CHANGELOG.md](CHANGELOG.md) for details.'
          releaseDraft: true
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Godot Harbor ${{ github.event.inputs.version }}
          body: |
            **Version:** ${{ github.event.inputs.version }}
            **Build Reason:** ${{ github.event.inputs.reason || 'Manual build' }}
            
            **Assets:**
            - Windows x86_64
            - Windows aarch64
            - macOS x86_64
            - macOS aarch64
            - Linux x86_64 (deb)
            - Linux x86_64 (AppImage)
          files: |
            artifacts/**/*
          draft: true
