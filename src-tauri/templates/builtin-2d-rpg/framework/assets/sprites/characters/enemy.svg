<svg xmlns="http://www.w3.org/2000/svg" width="20" height="32" viewBox="0 0 20 32">
  <!-- RPG Enemy - skeleton warrior -->
  <!-- Head (skull) -->
  <rect x="4" y="0" width="12" height="10" rx="2" fill="#ECF0F1"/>
  <!-- Eye sockets -->
  <rect x="6" y="3" width="3" height="3" rx="1" fill="#2C3E50"/>
  <rect x="11" y="3" width="3" height="3" rx="1" fill="#2C3E50"/>
  <!-- Red eyes -->
  <rect x="7" y="4" width="1.5" height="1.5" fill="#E74C3C"/>
  <rect x="12" y="4" width="1.5" height="1.5" fill="#E74C3C"/>
  <!-- Jaw -->
  <rect x="6" y="8" width="8" height="2" fill="#BDC3C7"/>
  <!-- Body (armor) -->
  <rect x="3" y="10" width="14" height="12" rx="1" fill="#7F8C8D"/>
  <!-- Armor detail -->
  <rect x="6" y="12" width="8" height="2" fill="#95A5A6"/>
  <rect x="6" y="16" width="8" height="2" fill="#95A5A6"/>
  <!-- Legs (bones) -->
  <rect x="5" y="22" width="3" height="7" rx="1" fill="#ECF0F1"/>
  <rect x="12" y="22" width="3" height="7" rx="1" fill="#ECF0F1"/>
  <!-- Feet -->
  <rect x="4" y="27" width="5" height="4" rx="1" fill="#7F8C8D"/>
  <rect x="11" y="27" width="5" height="4" rx="1" fill="#7F8C8D"/>
</svg>
