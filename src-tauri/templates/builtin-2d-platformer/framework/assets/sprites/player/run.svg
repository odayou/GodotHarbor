<svg xmlns="http://www.w3.org/2000/svg" width="28" height="32" viewBox="0 0 28 32">
  <!-- Player run - leaning forward with legs spread -->
  <!-- Head -->
  <rect x="8" y="0" width="12" height="10" rx="2" fill="#5B9BD5"/>
  <!-- Eyes -->
  <rect x="10" y="3" width="3" height="3" fill="#FFFFFF"/>
  <rect x="15" y="3" width="3" height="3" fill="#FFFFFF"/>
  <rect x="11" y="4" width="2" height="2" fill="#2C3E50"/>
  <rect x="16" y="4" width="2" height="2" fill="#2C3E50"/>
  <!-- Body (leaning) -->
  <rect x="5" y="10" width="16" height="12" rx="1" fill="#3498DB"/>
  <!-- Belt -->
  <rect x="5" y="18" width="16" height="2" fill="#2C3E50"/>
  <!-- Legs (running pose) -->
  <rect x="2" y="22" width="6" height="8" rx="1" fill="#2C3E50"/>
  <rect x="16" y="22" width="6" height="8" rx="1" fill="#2C3E50"/>
  <!-- Shoes -->
  <rect x="0" y="28" width="8" height="4" rx="1" fill="#8B4513"/>
  <rect x="16" y="28" width="8" height="4" rx="1" fill="#8B4513"/>
</svg>
