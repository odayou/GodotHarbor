[package]
name = "godot-harbor"
version = "1.0.5"
description = "Godot Harbor - Plugin and Project Management for Godot"
authors = ["Godot Harbor Team"]
edition = "2021"

[lib]
name = "godot_harbor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
rayon = "1"
regex = "1"
git2 = { version = "0.18", features = ["vendored-openssl"] }
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "stream", "native-tls-vendored"] }
zip = "2"
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
urlencoding = "2"
notify = "7"
once_cell = "1"
semver = "1"
percent-encoding = "2"
futures = "0.3"
fs2 = "0.4"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
